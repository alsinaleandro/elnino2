# Proxy para /api/rio-parana: Prefectura Naval solo acepta conexiones desde Argentina,
# así que Vercel consulta este VPS argentino en lugar de ir directo.
#
# Instalación (Debian/Ubuntu):
#   1. Reemplazar CAMBIAR_POR_TOKEN_SECRETO por un token largo (p. ej. `openssl rand -hex 32`).
#   2. Copiar a /etc/nginx/sites-available/prefectura y enlazar en sites-enabled.
#   3. `sudo nginx -t && sudo systemctl reload nginx`
#   4. En Vercel (Settings → Environment Variables):
#        PREFECTURA_PROXY_URL   = http://IP_DEL_VPS:8080/alturas/
#        PREFECTURA_PROXY_TOKEN = el mismo token
#
# Si el VPS tiene dominio, conviene servirlo por HTTPS (certbot) para que el token no viaje en claro.

server {
    listen 8080;
    server_name _;

    location = /alturas/ {
        if ($http_x_proxy_token != "CAMBIAR_POR_TOKEN_SECRETO") {
            return 403;
        }

        proxy_pass https://contenidosweb.prefecturanaval.gob.ar/alturas/;
        proxy_set_header Host contenidosweb.prefecturanaval.gob.ar;
        proxy_set_header X-Proxy-Token "";
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    location / {
        return 404;
    }
}
